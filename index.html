<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리말 기본기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F5F8F3; --sheet: #FFFFFF; --ink: #1D2924; --muted: #5E6E66; --line: #D3DDD6;
  --grid: rgba(60, 120, 90, .07); --hl: #FFE45C; --hl-soft: rgba(255, 228, 92, .5);
  --c3: #2850C8; --c4: #B8462F; --c5: #1C8455; --good: #1F8A55; --bad: #D0342C; --good-soft: rgba(31,138,85,.1); --bad-soft: rgba(208,52,44,.09);
  --shadow: 0 10px 30px -20px rgba(20, 50, 35, .45);
  --font-hand: "Gaegu", "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #111815; --sheet: #18221D; --ink: #E4ECE6; --muted: #9AAAA1; --line: #2A3830;
    --grid: rgba(140, 210, 170, .06); --hl: #C9AE2A; --hl-soft: rgba(214, 186, 50, .3);
    --c3: #8EA9FF; --c4: #FF9C83; --c5: #5ACB8C; --good: #5ACB8C; --bad: #FF7B72; --good-soft: rgba(90,203,140,.12); --bad-soft: rgba(255,123,114,.1); }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.7; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--c3); outline-offset: 2px; }
.wrap { max-width: 820px; margin: 0 auto; padding: 24px 16px 60px; }
header { margin-bottom: 18px; }
h1 { margin: 0; font-family: var(--font-hand); font-weight: 700; font-size: 46px; line-height: 1; white-space: nowrap; }
h1 mark { background: linear-gradient(transparent 55%, var(--hl) 55%, var(--hl) 88%, transparent 88%); color: inherit; padding: 0 4px; }
.sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--ink); margin-bottom: 18px; position: sticky; top: 0; background: var(--paper); z-index: 5; padding-top: 6px; }
.tab { border: 2px solid transparent; border-bottom: 0; background: transparent; padding: 9px 16px 8px; border-radius: 14px 14px 0 0; font-family: var(--font-hand); font-size: 24px; font-weight: 700; color: var(--muted); margin-bottom: -2px; line-height: 1.1; }
.tab[aria-selected="true"] { border-color: var(--ink); background: var(--sheet); color: var(--ink); }
.tab small { display: block; font-family: var(--font-body); font-size: 11.5px; font-weight: 400; color: var(--muted); }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1.5px solid var(--line); background: var(--sheet); border-radius: 99px; padding: 5px 13px; font-size: 14px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn { border: 1.5px solid var(--ink); background: var(--sheet); border-radius: 12px; padding: 8px 16px; font-weight: 700; box-shadow: 3px 3px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.ink { background: var(--ink); color: var(--paper); }
.btn:disabled { opacity: .45; cursor: default; }
.score { font-family: var(--font-mono); font-size: 15px; color: var(--muted); }
.score b { font-size: 20px; color: var(--ink); }

.sec-h { font-family: var(--font-hand); font-size: 28px; margin: 22px 0 10px; display: flex; align-items: center; gap: 10px; }
.sec-h::before { content: ""; width: 10px; height: 26px; border-radius: 4px; background: var(--cc); }
.list { display: flex; flex-direction: column; gap: 12px; }
.item { background: var(--sheet); border: 1.5px solid var(--line); border-left: 5px solid var(--cc); border-radius: 16px; padding: 14px 18px; box-shadow: var(--shadow); }
.item .no { font-family: var(--font-mono); font-size: 13px; color: var(--cc); font-weight: 600; }
.item .s { font-size: 17px; font-weight: 700; line-height: 1.65; margin: 2px 0 6px; word-break: keep-all; }
.hl { background: linear-gradient(transparent 50%, var(--hl) 50%, var(--hl) 92%, transparent 92%); padding: 0 2px; }
.wrong { color: var(--bad); font-size: 14.5px; margin: 0 0 4px; }
.wrong s { text-decoration-thickness: 2px; }
.why { margin: 0; font-size: 15px; color: var(--ink); word-break: keep-all; }
.why::before { content: "이유 "; font-family: var(--font-hand); font-weight: 700; font-size: 19px; color: var(--cc); margin-right: 2px; }

/* circle check */
.opts { display: inline-flex; flex-wrap: wrap; gap: 6px; vertical-align: middle; margin: 0 2px; }
.opt { position: relative; border: 1.5px dashed var(--line); background: var(--paper); border-radius: 10px; padding: 1px 10px; font-weight: 700; font-size: inherit; line-height: 1.6; }
.opt::after { content: ""; position: absolute; inset: -5px -7px; border: 2.5px solid transparent; border-radius: 50%; pointer-events: none; transform: rotate(-4deg); }
.opt.pick-ok::after { border-color: var(--good); }
.opt.pick-bad::after { border-color: var(--bad); }
.opt.pick-bad { text-decoration: line-through; text-decoration-color: var(--bad); }
.opt.show-ok { background: var(--good-soft); border-style: solid; border-color: var(--good); }
.opt:disabled { cursor: default; color: inherit; }
.item.ok { border-left-color: var(--good); }
.item.bad { border-left-color: var(--bad); background: linear-gradient(var(--bad-soft), var(--bad-soft)), var(--sheet); }
.verdict { font-family: var(--font-hand); font-size: 22px; font-weight: 700; }
.verdict.ok { color: var(--good); } .verdict.bad { color: var(--bad); }
.fb { display: none; margin-top: 6px; }
.item.done .fb { display: block; }

/* exam */
.paper { background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 18px; padding: 20px 22px; box-shadow: 6px 6px 0 var(--ink); }
.paper h2 { margin: 0 0 4px; font-size: 19px; }
.paper .inst { margin: 0 0 14px; color: var(--muted); font-size: 14.5px; }
.st { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 4px 10px; padding: 12px 0; border-top: 1px dashed var(--line); }
.st .k { font-weight: 700; font-size: 18px; font-family: var(--font-hand); line-height: 1.5; }
.st .t { font-size: 16.5px; line-height: 1.7; word-break: keep-all; }
.st .pick { grid-column: 2; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ox { border: 1.5px solid var(--line); background: var(--paper); border-radius: 10px; padding: 4px 14px; font-weight: 700; font-size: 15px; }
.ox[aria-pressed="true"].o { background: var(--good); border-color: var(--good); color: #fff; }
.ox[aria-pressed="true"].x { background: var(--bad); border-color: var(--bad); color: #fff; }
.st .res { grid-column: 2; display: none; font-size: 14.5px; border-radius: 10px; padding: 8px 12px; }
.st.graded .res { display: block; }
.st.right .res { background: var(--good-soft); } .st.miss .res { background: var(--bad-soft); }
.st .res b.ok { color: var(--good); } .st .res b.bad { color: var(--bad); }
.sum { margin-top: 16px; border-radius: 14px; padding: 14px 16px; background: var(--paper); display: none; }
.sum.on { display: block; }
.sum .big { font-family: var(--font-hand); font-size: 34px; font-weight: 700; line-height: 1.1; }
.sum p { margin: 6px 0 0; }
.act { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

/* card deck */
.deck { display: flex; flex-direction: column; gap: 14px; }
.dtop { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.prog { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .25s ease; }
.dcard { background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 22px; box-shadow: 6px 6px 0 var(--cc); padding: 22px 24px; min-height: 380px; display: flex; flex-direction: column; gap: 12px; touch-action: pan-y; }
.dcard .tagk { align-self: flex-start; font-size: 13px; font-weight: 700; color: var(--cc); border: 1.5px solid var(--cc); border-radius: 99px; padding: 1px 10px; }
.dcard .ask { font-family: var(--font-hand); font-size: 22px; font-weight: 700; color: var(--cc); line-height: 1.2; }
.dcard .s { font-size: 21px; font-weight: 700; line-height: 1.9; word-break: keep-all; }
.dcard .opt { font-size: 19px; }
.dcard .peek { align-self: flex-start; margin-top: 4px; font-size: 14.5px; padding: 7px 14px; box-shadow: 2px 2px 0 var(--ink); }
.dcard .peek[hidden] { display: none; }
.dcard .reveal { display: none; border-top: 1.5px dashed var(--line); padding-top: 12px; }
.dcard.done .reveal { display: block; }
.dcard .ans { font-size: 17px; font-weight: 700; line-height: 1.65; margin: 6px 0; word-break: keep-all; }
.dcard.ok { box-shadow: 6px 6px 0 var(--good); } .dcard.bad { box-shadow: 6px 6px 0 var(--bad); }
.dnav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.dnav .btn { padding: 12px 8px; font-size: 16px; }
.keys { text-align: center; color: var(--muted); font-size: 12.5px; margin: 0; }
.slide-l { animation: inL .28s ease; } .slide-r { animation: inR .28s ease; }
@keyframes inL { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes inR { from { transform: translateX(-40px); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .slide-l, .slide-r { animation: none; } }
@media (max-width: 560px) { .dcard { padding: 18px 16px; min-height: 360px; } .dcard .s { font-size: 18.5px; } .dcard .opt { font-size: 17px; } }
@media (max-width: 560px) {
  h1 { font-size: 38px; }
  .tab { font-size: 20px; padding: 8px 10px 7px; }
  .item { padding: 12px 14px; }
  .paper { padding: 16px 14px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>우리말 <mark>기본기</mark></h1>
    <p class="sub">기본기 다지기 3 · 연결 어미 10문제 &nbsp;+&nbsp; 3차시 고쳐 쓰기 13문제 &nbsp;+&nbsp; 기본기 다지기 4 · 헷갈리는 표기 21문제</p>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-read" aria-selected="true" aria-controls="view" type="button">카드<small>한 장씩 넘기기</small></button>
    <button class="tab" role="tab" id="t-circle" aria-selected="false" aria-controls="view" type="button">동그라미<small>바른 말 고르기</small></button>
    <button class="tab" role="tab" id="t-exam" aria-selected="false" aria-controls="view" type="button">시험<small>ㄱ~ㅂ 옳고 틀림</small></button>
  </div>
  <main id="view" role="tabpanel"></main>
</div>

<script>
(function () {
  "use strict";
  /* q : 문장, ___ 자리에 답이 들어감 / ok : 바른 말(여러 개 가능) / no : 틀린 말 / why : 이유 */
  var ITEMS = [
    { id: "a1", set: 3, q: "네가 나선다고 ___, 일이 좀 풀릴 것 같다.", ok: ["하니"], no: ["해서"],
      why: "‘-서’는 앞말이 뒷말의 객관적 이유·원인, 시간적 순서, 수단·방법일 때 쓴다. ‘-니’는 앞의 사실을 먼저 말하고 그에 대한 배경·이유·추론을 말할 때 쓴다(청유형·명령형도 가능). ‘일이 풀릴 것 같다’는 추론이라 ‘-니’가 맞다." },
    { id: "a2", set: 3, q: "힘든 생활에 ___ 유머 감각을 잃지 말아야 한다.", ok: ["찌들더라도"], no: ["찌들어"],
      why: "‘-어’는 논리적 모순 없이 이유·원인·조건 관계로 잇는 어미다. 이 문장은 양보 관계인 내용을 순접 관계로 이어서 잘못됐다. → 양보의 ‘-더라도’" },
    { id: "a3", set: 3, q: "미련한 사람은 쉽게 화를 ___, 슬기로운 사람은 모욕을 참는다.", ok: ["내고"], no: ["내지만"],
      why: "앞절과 뒷절을 바꾸어도 뜻이 전혀 바뀌지 않는 대등한 관계에는 ‘-고’, ‘-며’를 쓴다. ‘-지만’은 형식만 대등하고 의미상 앞뒤를 바꾸면 뜻이 바뀌므로 적절하지 않다." },
    { id: "a4", set: 3, q: "그것은 무모한 행동일지언정 용감한 ___.", ok: ["행동은 아니다"], no: ["행동이다"],
      why: "‘-ㄹ지언정’ 뒤의 절은 부정어와 결합하거나 반어적 표현이 된다." },
    { id: "a5", set: 3, q: "머리는 나쁠망정 ___.", ok: ["일은 잘한다"], no: ["일도 못한다"],
      why: "‘-ㄹ망정’은 뒷말에서 앞과 대립되는 다른 사실을 말할 때 쓴다. 앞뒤 절의 주어가 같지 않아도 쓸 수 있다(비교 : -ㄹ지언정)." },
    { id: "a6", set: 3, q: "그는 잘생겼을뿐더러 성격도 ___.", ok: ["좋다"], no: ["나쁘다"],
      why: "‘-ㄹ뿐더러’는 어떤 일이 그것만으로 그치지 않고 나아가 다른 일이 더 있음을 나타낸다. 같은 방향의 내용을 덧붙이며, 뒷절에서 주로 ‘-도’, ‘-까지’와 결합한다." },
    { id: "a7", set: 3, q: "짐승도 은혜를 알거든 하물며 ___.", ok: ["사람이 은혜를 모르랴"], no: ["사람은 더욱 은혜를 알아야 한다"],
      why: "‘-거든 / -거늘’은 앞의 사실이 이러하니 뒤의 사실은 더욱 당연하다는 뜻이다. ‘하물며’와 결합하며 반어형을 수반한다. 일반 의문형과는 어울리지 않는다." },
    { id: "a8", set: 3, q: "겉이 검은들 속까지 ___.", ok: ["검으랴", "검겠는가", "검을쏘냐"], no: ["검어서는 안 된다"],
      why: "‘-ㄴ들’은 어떤 조건을 양보해 인정해도 기대되는 결과는 부정적임을 나타낸다. 주로 반어형 의문문과 결합하고, 뒷절에 금지형 어미가 오면 어색하다." },
    { id: "a9", set: 3, q: "그는 집에 가고 ___ 책가방을 싸 들었다.", ok: ["싶다며"], no: ["싶다고"],
      why: "‘-라고’나 ‘-라며’ 뒤에 ‘말하다’ 이외의 행위 동사가 올 때 구별한다. 학습지 정리 : -라고는 간접 행위문, -라며는 간접 인용문. ‘책가방을 싸 들었다’는 행위이므로 ‘-며’로 고친다." },
    { id: "a10", set: 3, q: "대기 성층권에는 오존이 밀집해 ___ 태양 광선 중에서 생물체에 해로운 강한 자외선을 흡수하여 지구상의 생물체에 대한 보호막 구실을 한다.", ok: ["있는데 이 오존층은"], no: ["있어,"],
      why: "‘-어’, ‘-여’ 같은 연결 어미가 겹치면(연결 어미의 중첩) 문장 관계가 흐려진다. 다른 말(‘-는데’)로 바꾸고 뒤 절의 주어를 밝혀 주는 것이 좋다." },

    { id: "c1", set: 5, q: "그가 ___ 일이 잘될 것이다.", ok: ["오면"], no: ["오거든"],
      why: "조건의 ‘-거든’은 뒤 절에 명령·청유·약속·의지 같은 말이 올 때 쓴다(그가 오거든 연락해라). ‘일이 잘될 것이다’처럼 단순한 결과를 말할 때는 ‘-면’을 쓴다." },
    { id: "c2", set: 5, q: "차라리 죽을지언정 ___.", ok: ["항복하지는 않겠다"], no: ["항복하고 말겠다"],
      why: "‘-ㄹ지언정’ 뒤 절은 부정어와 결합하거나 반어적 표현이 된다. 앞의 극단적인 일을 받아들이더라도 뒤의 일은 하지 않겠다는 뜻이다." },
    { id: "c3", set: 5, q: "값이 ___ 꼭 하나 사겠다.", ok: ["비싸더라도"], no: ["비쌀지언정"],
      why: "‘-ㄹ지언정’ 뒤에는 부정·반어 표현이 와야 한다. ‘꼭 사겠다’처럼 긍정의 의지가 올 때는 양보의 ‘-더라도’를 쓴다." },
    { id: "c4", set: 5, q: "세계의 주요 문자 가운데 한자는 가장 오랫동안 생명을 ___.", ok: ["유지해 왔을뿐더러 글자 수도 가장 많다"], no: ["유지하고 있을뿐더러 가장 많은 글자로 이루어져 있다"],
      why: "‘-ㄹ뿐더러’는 어떤 일에 그치지 않고 다른 일이 더 있음을 덧붙이는 어미라서, 뒤 절에 주로 ‘-도’, ‘-까지’가 함께 온다. 앞뒤 내용을 같은 짜임으로 맞추면 덧붙이는 뜻이 살아난다." },
    { id: "c5", set: 5, q: "그는 땅을 ___ 통곡을 했다.", ok: ["치며"], no: ["치고"],
      why: "땅을 치는 동작과 통곡하는 동작이 동시에 일어나므로, 순서나 나열의 ‘-고’보다 동시 동작을 나타내는 ‘-며’가 자연스럽다." },
    { id: "c6", set: 5, q: "철수는 “공부하기 싫다.”___ 말했다.", ok: ["라고"], no: ["라며"],
      why: "‘말하다’처럼 인용한 말을 바로 받는 서술어 앞에는 직접 인용의 ‘-라고’를 쓴다. ‘-라며’는 ‘-라고 하면서’가 줄어든 말이라 말하면서 다른 동작을 할 때 쓴다(“~”라며 웃었다)." },
    { id: "c7", set: 5, noFix: true, q: "아이가 사고 싶은 물건이 ___ 졸라 댔다.", ok: ["있다며"], no: [],
      why: "고칠 필요 없는 바른 문장이다. ‘-다며’는 ‘-다고 하면서’가 줄어든 말로, ‘물건이 있다고 말하면서’ 동시에 ‘졸라 대는’ 두 동작을 나타내므로 자연스럽다. 6번 ‘-라며 말했다’와 비교해 두자." },
    { id: "c8", set: 5, q: "성매매특별법이 시행된 지 1년여가 ___ 이들 법률의 성과에 대해 의견이 분분하다.", ok: ["지났는데", "지났지만"], no: ["지나자"],
      why: "‘-자’는 앞의 일이 일어난 바로 뒤에 다른 일이 잇따라 일어날 때 쓰므로 뒤 절도 새로 생긴 일이어야 자연스럽다. ‘의견이 분분하다’는 지금의 상태라 어울리지 않는다." },
    { id: "c9", set: 5, q: "그동안 각자 살아온 이야기를 ___ 마치 옛날로 돌아간 느낌이었다.", ok: ["나누다 보니"], no: ["나누며"],
      why: "‘-며’는 같은 주어가 두 동작을 함께 할 때 쓴다. 앞 절은 ‘(우리가) 이야기를 나누다’인데 뒤 절은 ‘느낌이었다’라 주어와 서술어가 맞지 않는다. 앞의 행동이 이어진 결과를 나타내는 ‘-다 보니’로 고친다." },
    { id: "c10", set: 5, q: "화제가 ___ 그 친구는 딸들에게 검도를 가르치고 있다고 했다.", ok: ["자녀들 이야기로 옮겨 가자"], no: ["자녀들에게로 돌려지면서"],
      why: "‘-면서’는 두 동작이 동시에 일어날 때 쓰고 보통 앞뒤 주어가 같다. 여기서는 화제가 바뀐 직후에 친구가 말을 꺼낸 것이므로 ‘-자’가 자연스럽다. ‘자녀들에게로 돌려지다’라는 어색한 피동 표현도 함께 고친다." },
    { id: "c11", set: 5, q: "___ 그날 일을 다 끝내는 습관을 들이면 성공할 수 있다.", ok: ["피곤하더라도"], no: ["피곤하지만"],
      why: "‘-지만’은 앞뒤 절을 대등하게 잇는 역접 어미라 문장 전체(성공할 수 있다)와 연결되어 버린다. ‘피곤해도 일을 끝낸다’는 습관의 내용이므로 양보의 ‘-더라도’를 쓴다." },
    { id: "c12", set: 5, q: "일본은 1909년 철도 개설권을 얻는 대가로 간도 지방을 청에 ___ 현재에 이르고 있다.", ok: ["넘겨주었다. 그 결과 간도는 중국의 영토가 되었고,"], no: ["넘겨주어 간도는 중국의 영토가 되어"],
      why: "‘-어’가 겹쳐 쓰이고(연결 어미의 중첩) 중간에 주어까지 바뀌어(일본은 → 간도는) 문장 관계가 흐려졌다. 문장을 나누고 ‘그 결과’로 이어 준다." },
    { id: "c13", set: 5, q: "수많은 사람들이 취업난에 허덕이고 ___ 3D 업종은 외면당하고 있다.", ok: ["있는데도"], no: ["있으면서도"],
      why: "‘-면서도’는 같은 주어의 두 행동이 서로 맞서는 관계일 때 쓴다. 앞 절의 주어(사람들)와 뒤 절의 주어(3D 업종)가 다르므로 ‘-는데도’로 고친다." },

    { id: "b1", set: 4, q: "그것이 내 기준에 ___ 크기다.", ok: ["알맞은"], no: ["알맞는"], why: "‘알맞다’는 형용사라서 현재 관형사형 어미 ‘-ㄴ/-은’이 붙는다(‘-는’은 동사). 걸맞은도 같다." },
    { id: "b2", set: 4, q: "___ 양복에 조끼까지 껴입고 금테 안경까지 곁들인 딴으론 신사의 위풍을 뽐냈다.", ok: ["검은색"], no: ["검정색"], why: "‘검정’에 이미 검은 빛깔이라는 뜻이 있어서 ‘색’을 더하면 의미가 중복된다. 검정 = 검은색 (노랑 = 노란색, 파랑 = 파란색)" },
    { id: "b3", set: 4, q: "오작녀가 앞질러 앞장을 섰다. ___ 훈의 걸음걸이를 재어, 꼭 두어 걸음 앞을 서 길잡이 노릇을 하는 것이었다.", ok: ["그러고는"], no: ["그리고는"], why: "그리하고 나서는 = 그러고 나서는 = 그러고는. ‘그리고’는 접속 부사라 뒤에 ‘-는’이 붙지 않는다." },
    { id: "b4", set: 4, q: "행사장에는 우리나라에서 ___ 가수들이 다 모였다.", ok: ["내로라하는"], no: ["내노라하는"], why: "‘내로라’는 ‘나이로라’가 줄어든 말이다. 내로라하다 : 어떤 분야를 대표할 만하다(한 단어라 붙여 씀)." },
    { id: "b5", set: 4, q: "잔뜩 뿔이 돋아 있던 낙준이는 차가 멎기 무섭게 가시 ___ 고함으로 우리를 맞았다.", ok: ["돋친"], no: ["돋힌"], why: "돋는 것은 외부의 힘이 아니라 스스로의 작용이라 피동형(돋히다)으로 만들 수 없다. ‘돋치다’는 ‘돋다’에 강조 접미사 ‘-치-’가 붙은 말이다." },
    { id: "b6", set: 4, q: "___ 유태림이 장성함에 따라 아들이 시키는 대로만 한다는 풍평이 있었다.", ok: ["되레"], no: ["되려"], why: "도리어 = 되레, 오히려 = 외려." },
    { id: "b7", set: 4, q: "진정 미워해야 할 부류는 우리 내부에 ___ 모른다.", ok: ["있을는지"], no: ["있을런지"], why: "‘-ㄹ는지’는 어떤 일이나 사실의 실현 가능성에 대한 의문을 나타내는 어미다. ‘-ㄹ런지’는 없는 말." },
    { id: "b8", set: 4, q: "요새 ___은 불도 뜨뜻이 때고 마음 놓고 밥도 먹으니까 심신이 편해 그런지 잠이 많아졌다.", ok: ["며칠"], no: ["몇일"], why: "‘몇 년, 몇 월, 며칠’이 표준 맞춤법 표기다." },
    { id: "b9", set: 4, q: "민은 얼굴이 시뻘게서 두 손을 마주 ___ 서 있을 뿐.", ok: ["비비며"], no: ["부비며"], why: "비비다 : 두 물체를 맞대어 문지르다, 재료를 넣어 한데 버무리다. ‘부비다’는 잘못된 표기다." },
    { id: "b10", set: 4, q: "수도원을 지나서 시의 변두리를 흐르는 강에 걸린 시멘트 다리는 기둥만 덩그렇게 남기고 ___ 있다.", ok: ["부서져"], no: ["부숴져"], why: "‘부수다’의 피동형은 ‘부서지다’다. ‘부수어지다(부숴지다)’가 아니다." },
    { id: "b11", set: 4, q: "자기를 책하되 비관 또는 실망에 그치고 마는 일은 ___ 한다.", ok: ["삼가야"], no: ["삼가해야"], why: "‘삼가하다’는 사전에 없는 말로 ‘삼가다’를 잘못 쓴 것이다. 삼가다 : 몸가짐이나 언행을 조심하다, 양이나 횟수가 지나치지 않도록 하다." },
    { id: "b12", set: 4, q: "___ 서성서성 방 속을 거닐었다.", ok: ["안절부절못하고"], no: ["안절부절하고"], why: "안절부절못하다 : 마음이 초조하고 불안하여 어찌할 바를 모르다(한 단어)." },
    { id: "b13", set: 4, q: "어마어마한 이름을 뒤집어씌워 그렇지 실은 사건이 될 턱이 없는 ___ 일이었다.", ok: ["어쭙잖은"], no: ["어줍잖은"], why: "어쭙잖다 : 비웃음을 살 만큼 언행이 분수에 넘치는 데가 있다." },
    { id: "b14", set: 4, q: "임칠병이 십여 차례도 넘게 ___ 화차 고개의 무용담을 다시 꺼냈다.", ok: ["우려먹은"], no: ["울궈먹은"], why: "우려먹다 : 이미 썼던 내용을 다시 써먹다, 액체에 담가 맛이나 빛깔이 빠져나오게 하다." },
    { id: "b15", set: 4, q: "나는 요즘 자도자도 ___.", ok: ["졸리다"], no: ["졸립다"], why: "‘졸립다’는 사전에 없는 말이다. 졸리다 : 자고 싶은 느낌이 들다(동사이자 형용사)." },
    { id: "b16", set: 4, q: "___ 술판이 아니면 노름판에 붙어 지낸다.", ok: ["주야장천"], no: ["주구장창"], why: "주야장천 : 밤낮 쉼 없이 흐르는 냇물이라는 뜻으로, 밤낮으로 쉬지 아니하고 연달아." },
    { id: "b17", set: 4, q: "그런 식으로 할 거면 다 ___.", ok: ["집어치워라"], no: ["집어쳐라"], why: "집어치우다, 때려치우다(○) / 집어치다, 때려치다(✕)" },
    { id: "b18", set: 4, q: "팔자가 사나워서 이리 ___ 사는가 보다 했는데 그게 아니었다.", ok: ["차이고 저리 차이면서"], no: ["채이고 저리 채이면서"], why: "차이다 : ‘차다’의 피동사. 준말은 ‘채다’(차이다 = 채다)라서 ‘채이다’는 틀린 말이다." },
    { id: "b19", set: 4, q: "어느 날 느닷없이 훌쩍 증발해 버렸다고들 ___.", ok: ["하데"], no: ["하대"], why: "-데 : 직접 경험한 사실을 말할 때. -대 : 직접 경험한 것이 아닌 것을 전할 때(‘-다고 해’가 줄어든 말) 또는 의문을 나타낼 때." },
    { id: "b20", set: 4, q: "나는 ___.", ok: ["바람이에요", "바람이어요"], no: ["바람이예요"], why: "-에요는 ‘이다’, ‘아니다’에 붙는 종결 어미. 받침 있는 말 + 이에요, 받침 없는 말 + 예요. 아니에요, 준영이예요. -어요도 표준어(이에요 = 이어요)." },
    { id: "b21", set: 4, q: "“기름은 얼마나 넣을까요?” “___.”", ok: ["가득요", "가득이요"], no: [], why: "‘-이요’는 청자에게 존대의 뜻을 나타내는 보조사 ‘요’와 통용된다. 둘 다 맞다." }
  ];
  var SETNAME = { 3: "기본기 3 · 연결 어미", 5: "3차시 · 연결 어미 고쳐 쓰기", 4: "기본기 4 · 헷갈리는 표기" };
  var KO = ["ㄱ", "ㄴ", "ㄷ", "ㄹ", "ㅁ", "ㅂ"];

  var view = document.getElementById("view");
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function col(it) { return setCol(it.set); }
  function setCol(n) { return n === 3 ? "var(--c3)" : n === 5 ? "var(--c5)" : "var(--c4)"; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  // put a node (or text) into the ___ slot
  function sentence(parent, it, fill) {
    var parts = it.q.split("___");
    parent.appendChild(document.createTextNode(parts[0]));
    if (typeof fill === "string") parent.appendChild(document.createTextNode(fill));
    else parent.appendChild(fill);
    parent.appendChild(document.createTextNode(parts[1] || ""));
    return parent;
  }
  function filled(it, word) { return it.q.replace("___", word); }

  /* ---------------- tab 1 : 카드 */
  var deck = { i: 0, picks: {} };
  function viewRead() {
    var wrap = el("div", "deck");
    var top = el("div", "dtop");
    var cnt = el("div", "score"); top.appendChild(cnt);
    var chips = el("div", "chips");
    var reset = el("button", "chip", "처음부터 다시"); reset.type = "button";
    reset.addEventListener("click", function () { deck.i = 0; deck.picks = {}; draw(0); });
    chips.appendChild(reset); top.appendChild(chips);
    var prog = el("div", "prog"); var fill = el("i"); prog.appendChild(fill);
    var holder = el("div");
    var nav = el("div", "dnav");
    var prev = el("button", "btn", "← 이전"), next = el("button", "btn ink", "다음 →"); prev.type = next.type = "button";
    nav.appendChild(prev); nav.appendChild(next);
    wrap.appendChild(top); wrap.appendChild(prog); wrap.appendChild(holder); wrap.appendChild(nav);
    wrap.appendChild(el("p", "keys", "바른 말을 눌러 동그라미 하거나 ‘정답 및 이유 보기’를 누르면 정답이 보여요 · 옆으로 밀거나 ← → 키로 넘겨요"));
    view.appendChild(wrap);
    function draw(dir) {
      var it = ITEMS[deck.i];
      var solved = Object.keys(deck.picks).length, right = 0;
      var seenN = 0; Object.keys(deck.picks).forEach(function (k) { if (deck.picks[k].seen) seenN++; else if (deck.picks[k].ok) right++; }); solved -= seenN;
      cnt.textContent = "";
      var b = el("b", null, String(deck.i + 1)); cnt.appendChild(b);
      cnt.appendChild(document.createTextNode(" / " + ITEMS.length + "  ·  맞힌 카드 " + right + " / " + solved));
      fill.style.width = ((deck.i + 1) / ITEMS.length * 100) + "%";
      prev.disabled = deck.i === 0; next.disabled = deck.i === ITEMS.length - 1;
      holder.textContent = "";
      var c = el("article", "dcard" + (dir ? (dir > 0 ? " slide-l" : " slide-r") : ""));
      c.style.setProperty("--cc", col(it));
      c.appendChild(el("span", "tagk", SETNAME[it.set]));
      c.appendChild(el("div", "ask", it.noFix ? "이 문장, 고쳐야 할까?" : it.set === 4 ? "바른 말은 어느 쪽일까?" : "어느 쪽이 자연스러울까?"));
      var opts = el("span", "opts"), btns = [];
      var key = it.id, prevPick = deck.picks[key];
      var ch = prevPick ? prevPick.choices : choicesOf(it);
      ch.forEach(function (o, idx) {
        var bt = el("button", "opt", o.t); bt.type = "button"; bt._ok = o.ok; btns.push(bt); opts.appendChild(bt);
        bt.addEventListener("click", function () { if (deck.picks[key]) return; deck.picks[key] = { ok: o.ok, idx: idx, choices: ch }; mark(); draw(0); });
      });
      var s = el("div", "s");
      if (it.id === "b21") { s.appendChild(document.createTextNode(it.q.replace("___", "가득요 / 가득이요") + "  ")); s.appendChild(opts); }
        else if (it.noFix) { s.appendChild(document.createTextNode(filled(it, it.ok[0]) + "  ")); s.appendChild(opts); }
      else sentence(s, it, opts);
      c.appendChild(s);
      var peek = el("button", "btn peek", "정답 및 이유 보기"); peek.type = "button";
      peek.addEventListener("click", function () { if (deck.picks[key]) return; deck.picks[key] = { seen: true, choices: ch }; draw(0); });
      c.appendChild(peek);
      var rv = el("div", "reveal");
      var verdict = el("div", "verdict"); rv.appendChild(verdict);
      rv.appendChild(sentence(el("div", "ans"), it, el("span", "hl", it.ok.join(" / "))));
      if (it.no.length) { var w = el("p", "wrong"); w.appendChild(document.createTextNode("✕ ")); w.appendChild(el("s", null, it.no.join(", "))); rv.appendChild(w); }
      else rv.appendChild(el("p", "wrong", it.noFix ? "고칠 필요 없음" : "둘 다 맞음"));
      rv.appendChild(el("p", "why", it.why));
      c.appendChild(rv);
      function mark() {}
      if (prevPick && prevPick.seen) {
        c.classList.add("done"); peek.hidden = true;
        verdict.textContent = "정답 확인"; verdict.className = "verdict";
        btns.forEach(function (x) { x.disabled = true; if (x._ok) x.classList.add("show-ok"); });
      } else if (prevPick) {
        peek.hidden = true;
        c.classList.add("done", prevPick.ok ? "ok" : "bad");
        verdict.textContent = prevPick.ok ? "정답!" : "아쉬워요"; verdict.className = "verdict " + (prevPick.ok ? "ok" : "bad");
        btns.forEach(function (x, idx) { x.disabled = true; if (idx === prevPick.idx) x.classList.add(prevPick.ok ? "pick-ok" : "pick-bad"); if (!prevPick.ok && x._ok) x.classList.add("show-ok"); });
      }
      holder.appendChild(c);
      var sx = null, sy = null;
      c.addEventListener("touchstart", function (e) { var t = e.touches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
      c.addEventListener("touchend", function (e) { if (sx == null) return; var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy; sx = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) go(dx < 0 ? 1 : -1); });
    }
    function go(d) { var n = deck.i + d; if (n < 0 || n >= ITEMS.length) return; deck.i = n; draw(d); }
    prev.addEventListener("click", function () { go(-1); });
    next.addEventListener("click", function () { go(1); });
    keyHandler = function (e) { if (e.key === "ArrowRight") { e.preventDefault(); go(1); } else if (e.key === "ArrowLeft") { e.preventDefault(); go(-1); } };
    draw(0);
  }
  var keyHandler = null;
  document.addEventListener("keydown", function (e) { if (keyHandler && document.getElementById("t-read").getAttribute("aria-selected") === "true") keyHandler(e); });
  function sectionHead(set) { var h = el("h2", "sec-h", SETNAME[set]); h.style.setProperty("--cc", setCol(set)); return h; }

  /* ---------------- tab 2 : 동그라미 */
  var circ = { done: {}, right: 0, onlyWrong: false, wrongIds: {} };
  function choicesOf(it) {
    if (it.id === "b21") return [{ t: "가득요만", ok: false }, { t: "가득이요만", ok: false }, { t: "둘 다 맞음", ok: true }];
    if (it.noFix) return [{ t: "그대로 바름", ok: true }, { t: "고쳐야 함", ok: false }];
    var a = it.ok.slice(0, it.id === "a8" ? 1 : it.ok.length).map(function (t) { return { t: t, ok: true }; })
      .concat(it.no.map(function (t) { return { t: t, ok: false }; }));
    return shuffle(a);
  }
  function viewCircle() {
    var bar = el("div", "bar");
    var sc = el("div", "score"); sc.innerHTML = "";
    var b1 = el("b", null, "0"); sc.appendChild(b1); sc.appendChild(document.createTextNode(" 맞음 / ")); var b2 = el("span", null, "0"); sc.appendChild(b2); sc.appendChild(document.createTextNode(" 문제 풂"));
    var chips = el("div", "chips");
    var reset = el("button", "chip", "다시 풀기"); reset.type = "button";
    var only = el("button", "chip", "틀린 것만"); only.type = "button"; only.setAttribute("aria-pressed", String(circ.onlyWrong));
    chips.appendChild(only); chips.appendChild(reset);
    bar.appendChild(sc); bar.appendChild(chips); view.appendChild(bar);
    view.appendChild(el("p", "sub", "괄호 속에서 바른 말을 눌러 동그라미 하세요. 바로 채점되고 이유가 나와요."));
    var solved = 0, right = 0;
    function upd() { b1.textContent = right; b2.textContent = solved; }
    reset.addEventListener("click", function () { circ.onlyWrong = false; render("circle"); });
    only.addEventListener("click", function () { circ.onlyWrong = !circ.onlyWrong; render("circle"); });
    var pool = ITEMS.filter(function (it) { return !circ.onlyWrong || circ.wrongIds[it.id]; });
    if (circ.onlyWrong && !pool.length) { view.appendChild(el("p", "sub", "틀린 문제가 없어요. 먼저 전체를 풀어 보세요.")); return; }
    [3, 5, 4].forEach(function (set) {
      var items = pool.filter(function (it) { return it.set === set; });
      if (!items.length) return;
      view.appendChild(sectionHead(set));
      var list = el("div", "list");
      items.forEach(function (it, k) {
        var box = el("article", "item"); box.style.setProperty("--cc", col(it));
        box.appendChild(el("div", "no", String(k + 1).padStart(2, "0")));
        var opts = el("span", "opts"), btns = [];
        choicesOf(it).forEach(function (c) {
          var b = el("button", "opt", c.t); b.type = "button"; b._ok = c.ok; btns.push(b); opts.appendChild(b);
          b.addEventListener("click", function () {
            if (box.classList.contains("done")) return;
            box.classList.add("done"); solved++;
            if (c.ok) { right++; b.classList.add("pick-ok"); box.classList.add("ok"); verdict.textContent = "정답!"; verdict.className = "verdict ok"; delete circ.wrongIds[it.id]; }
            else { b.classList.add("pick-bad"); box.classList.add("bad"); verdict.textContent = "아쉬워요"; verdict.className = "verdict bad"; circ.wrongIds[it.id] = 1; btns.forEach(function (x) { if (x._ok) x.classList.add("show-ok"); }); }
            btns.forEach(function (x) { x.disabled = true; });
            upd();
          });
        });
        var s = el("div", "s");
        if (it.id === "b21") { s.appendChild(document.createTextNode(it.q.replace("___", "가득요 / 가득이요") + "  ")); s.appendChild(opts); }
        else if (it.noFix) { s.appendChild(document.createTextNode(filled(it, it.ok[0]) + "  ")); s.appendChild(opts); }
        else sentence(s, it, opts);
        box.appendChild(s);
        var fb = el("div", "fb"); var verdict = el("span", "verdict"); fb.appendChild(verdict);
        fb.appendChild(el("p", "why", it.why)); box.appendChild(fb);
        list.appendChild(box);
      });
      view.appendChild(list);
    });
    upd();
  }

  /* ---------------- tab 3 : 시험 */
  var exam = { range: "all", rounds: 0, best: null };
  function makeExam() {
    var pool = ITEMS.filter(function (it) { return exam.range === "all" || String(it.set) === exam.range; });
    var picked = shuffle(pool).slice(0, 6);
    // 옳은 문장 2~4개가 되도록 섞기
    var nRight = 2 + Math.floor(Math.random() * 3);
    var order = shuffle(picked.map(function (_, i) { return i; }));
    return picked.map(function (it, i) {
      var makeRight = order.indexOf(i) < nRight || !it.no.length;
      var word = makeRight ? it.ok[Math.floor(Math.random() * it.ok.length)] : it.no[Math.floor(Math.random() * it.no.length)];
      return { it: it, right: makeRight, word: word, text: filled(it, word), ans: null };
    });
  }
  function viewExam() {
    var bar = el("div", "bar");
    var chips = el("div", "chips");
    [["all", "전체"], ["3", "기본기 3"], ["5", "3차시 고쳐 쓰기"], ["4", "헷갈리는 표기"]].forEach(function (r) {
      var c = el("button", "chip", r[1]); c.type = "button"; c.setAttribute("aria-pressed", String(exam.range === r[0]));
      c.addEventListener("click", function () { exam.range = r[0]; exam.cur = null; render("exam"); });
      chips.appendChild(c);
    });
    bar.appendChild(chips);
    var sc = el("div", "score", exam.rounds ? "푼 시험 " + exam.rounds + "회 · 최고 " + exam.best + " / 6" : "");
    bar.appendChild(sc);
    view.appendChild(bar);
    if (!exam.cur) exam.cur = makeExam();
    var Q = exam.cur;
    var paper = el("section", "paper");
    paper.appendChild(el("h2", null, "다음 ㄱ~ㅂ의 문장을 옳은 것과 틀린 것으로 분류하시오."));
    paper.appendChild(el("p", "inst", "각 문장의 ‘옳음’ 또는 ‘틀림’을 누른 뒤 채점하세요. (맞춤법·연결 어미 사용이 바른지 판단)"));
    var rows = [];
    Q.forEach(function (q, i) {
      var r = el("div", "st");
      r.appendChild(el("div", "k", KO[i] + "."));
      r.appendChild(el("div", "t", q.text));
      var pick = el("div", "pick");
      var o = el("button", "ox o", "○ 옳음"), x = el("button", "ox x", "✕ 틀림"); o.type = x.type = "button";
      o.setAttribute("aria-pressed", "false"); x.setAttribute("aria-pressed", "false");
      o.setAttribute("aria-label", KO[i] + " 옳음"); x.setAttribute("aria-label", KO[i] + " 틀림");
      function set(v) { if (r.classList.contains("graded")) return; q.ans = v; o.setAttribute("aria-pressed", String(v === true)); x.setAttribute("aria-pressed", String(v === false)); check(); }
      o.addEventListener("click", function () { set(true); }); x.addEventListener("click", function () { set(false); });
      pick.appendChild(o); pick.appendChild(x); r.appendChild(pick);
      var res = el("div", "res"); r.appendChild(res);
      rows.push({ r: r, res: res, o: o, x: x });
      paper.appendChild(r);
    });
    var sum = el("div", "sum");
    var act = el("div", "act");
    var grade = el("button", "btn ink", "채점하기"); grade.type = "button"; grade.disabled = true;
    var next = el("button", "btn", "새 시험지"); next.type = "button";
    act.appendChild(grade); act.appendChild(next);
    paper.appendChild(act); paper.appendChild(sum);
    view.appendChild(paper);
    function check() { grade.disabled = Q.some(function (q) { return q.ans === null; }); }
    next.addEventListener("click", function () { exam.cur = null; render("exam"); });
    grade.addEventListener("click", function () {
      var n = 0;
      Q.forEach(function (q, i) {
        var R = rows[i], good = q.ans === q.right; if (good) n++;
        R.r.classList.add("graded", good ? "right" : "miss");
        R.o.disabled = R.x.disabled = true;
        R.res.textContent = "";
        var head = el("b", good ? "ok" : "bad", good ? "맞음 · " : "틀림 · ");
        R.res.appendChild(head);
        R.res.appendChild(document.createTextNode(q.right ? "옳은 문장이에요. " : "틀린 문장이에요. 바른 말 → "));
        if (!q.right) { R.res.appendChild(el("span", "hl", q.it.ok.join(" / "))); R.res.appendChild(document.createTextNode(". ")); }
        R.res.appendChild(document.createTextNode(q.it.why));
      });
      var okList = [], noList = [];
      Q.forEach(function (q, i) { (q.right ? okList : noList).push(KO[i]); });
      sum.textContent = "";
      sum.appendChild(el("div", "big", n + " / 6"));
      sum.appendChild(el("p", null, "옳은 것 : " + (okList.join(", ") || "없음")));
      sum.appendChild(el("p", null, "틀린 것 : " + (noList.join(", ") || "없음")));
      sum.classList.add("on");
      grade.disabled = true;
      exam.rounds++; exam.best = exam.best == null ? n : Math.max(exam.best, n);
      sc.textContent = "푼 시험 " + exam.rounds + "회 · 최고 " + exam.best + " / 6";
    });
  }

  /* ---------------- tabs */
  var TABS = { read: viewRead, circle: viewCircle, exam: viewExam };
  function render(name) {
    Object.keys(TABS).forEach(function (k) { document.getElementById("t-" + k).setAttribute("aria-selected", String(k === name)); });
    view.textContent = "";
    TABS[name]();
    try { localStorage.setItem("kor-tab", name); } catch (e) { /* ignore */ }
  }
  Object.keys(TABS).forEach(function (k) {
    document.getElementById("t-" + k).addEventListener("click", function () { render(k); window.scrollTo(0, 0); });
  });
  var start = "read"; try { var s = localStorage.getItem("kor-tab"); if (TABS[s]) start = s; } catch (e) { /* ignore */ }
  render(start);
})();
</script>
</body>
</html>
